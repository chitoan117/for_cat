; Safe default: compile-only simulations, no physical GPIO actuator output.
[platformio]
default_envs = esp32dev_sim

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -DACTUATOR_OUTPUTS_ENABLED=0

[env:esp32dev_sim]
build_flags =
    ${env.build_flags}
    -DSIMULATED_SENSORS=1
    -DFORR_BOARD_CLASSIC=1

[env:esp32dev_hw_safe]
build_flags =
    ${env.build_flags}
    -DGENERIC_ESP32DEV=1
    -DFORR_BOARD_CLASSIC=1
    -DFORR_HW_SAFE=1

; Legacy name retained for Phase 2 manual build instructions; also inert.
[env:esp32dev]
build_flags =
    ${env.build_flags}
    -DSIMULATED_SENSORS=1
    -DFORR_BOARD_CLASSIC=1

; COMPILE SURROGATE ONLY: official N8 manifest, supported memory overrides.
; NOT EXACT SELLER BOARD VERIFIED / NOT HARDWARE VERIFIED.
[s3_surrogate]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = default_16MB.csv
build_flags =
    ${env.build_flags}
    -DFORR_BOARD_S3=1
    -DBOARD_HAS_PSRAM
    -DFORR_NATIVE_USB=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32s3_n16r8_sim]
extends = s3_surrogate
build_flags =
    ${s3_surrogate.build_flags}
    -DSIMULATED_SENSORS=1

[env:esp32s3_n16r8_hw_safe]
extends = s3_surrogate
build_flags =
    ${s3_surrogate.build_flags}
    -DFORR_HW_SAFE=1

; M3 first-flash option: CH343G/other bridge -> UART0, not native USB CDC.
; Still COMPILE SURROGATE ONLY. Confirm exact module/memory/bridge routing first.
[env:esp32s3_n16r8_hw_safe_uart]
extends = s3_surrogate
build_flags =
    ${env.build_flags}
    -DFORR_BOARD_S3=1
    -DBOARD_HAS_PSRAM
    -DFORR_NATIVE_USB=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DFORR_HW_SAFE=1
    -DFORR_BUILD_BANNER=1

; Real driver diagnostics: explicitly selected, no pins guessed or outputs enabled.
; Binary UART v1 firmware is NOT active in these human ASCII diagnostic images.
[m4_diagnostic]
extends = s3_surrogate
build_flags =
    ${env.build_flags}
    -DFORR_BOARD_S3=1
    -DBOARD_HAS_PSRAM
    -DFORR_NATIVE_USB=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DFORR_HW_SAFE=1
    -DSERVO_DIAGNOSTIC_ENABLED=0
    -DPUMP_DIAGNOSTIC_ENABLED=0

[env:diag_hx711]
extends = m4_sensor_bringup
build_flags = ${m4_sensor_bringup.build_flags} -DM4_DIAGNOSTIC_MODE=1 -DM4_HX711_INSTALLED=1

[env:diag_rtc]
extends = m4_sensor_bringup
build_flags = ${m4_sensor_bringup.build_flags} -DM4_DIAGNOSTIC_MODE=2

[env:diag_i2c]
extends = m4_sensor_bringup
build_flags = ${m4_sensor_bringup.build_flags} -DM4_DIAGNOSTIC_MODE=3

[env:diag_food_sensor]
; Legacy environment alias; no longer a hopper-level sensor. Use diag_approach_sensor.
extends = m4_sensor_bringup
build_flags = ${m4_sensor_bringup.build_flags} -DM4_DIAGNOSTIC_MODE=4

[env:diag_approach_sensor]
extends = m4_sensor_bringup
build_flags = ${m4_sensor_bringup.build_flags} -DM4_DIAGNOSTIC_MODE=4

[env:diag_water_sensor]
extends = m4_sensor_bringup
build_flags = ${m4_sensor_bringup.build_flags} -DM4_DIAGNOSTIC_MODE=5

[env:diag_oled_button_buzzer]
extends = m4_sensor_bringup
build_flags = ${m4_sensor_bringup.build_flags} -DM4_DIAGNOSTIC_MODE=6

; Current user-reported S3: 16MB flash, PSRAM not detected; bridge UART0.
[s3_real_no_psram]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
build_flags =
    ${env.build_flags}
    -DFORR_BOARD_S3=1
    -DFORR_REAL_S3_NO_PSRAM=1
    -DFORR_NATIVE_USB=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DFORR_HW_SAFE=1
    -DSERVO_DIAGNOSTIC_ENABLED=0
    -DPUMP_DIAGNOSTIC_ENABLED=0

[m4_sensor_bringup]
extends = s3_real_no_psram
build_flags = ${s3_real_no_psram.build_flags} -DM4_SENSOR_BRINGUP=1

; Isolated, explicit supervised GPIO6 PWM image. Compiling does NOT arm/move.
; Not an ordinary feed/diagnostic image; pump/automatic outputs remain disabled.
[env:diag_servo_bench]
extends = s3_real_no_psram
build_flags = ${s3_real_no_psram.build_flags} -DSERVO_BENCH_MODE=1 -DSERVO_BENCH_PHYSICAL_ENABLE=1

; Supervised only. HX calibration is loaded from sensors-v2, never auto tare.
; THIS IMAGE CAN MOVE GPIO6 after explicit inspection/config/arm. No normal feed.
[env:diag_dispense_bench]
extends = s3_real_no_psram
build_flags = ${s3_real_no_psram.build_flags} -DDISPENSE_BENCH_MODE=1 -DDISPENSE_BENCH_PHYSICAL_ENABLE=1

[env:diag_all_sensors]
extends = m4_sensor_bringup
build_flags = ${m4_sensor_bringup.build_flags} -DM4_DIAGNOSTIC_MODE=7 -DM4_HX711_INSTALLED=0

; Current owner-reported wired sensor set; NO actuator GPIO commands/drive.
; Unlike historical diag_all_sensors, HX711 GPIO4/5 is deliberately acquired.
[env:diag_current_hardware]
extends = m4_sensor_bringup
build_flags = ${m4_sensor_bringup.build_flags} -DM4_DIAGNOSTIC_MODE=7 -DM4_HX711_INSTALLED=1 -DM4_CURRENT_HARDWARE_PROFILE=1

; UNFLASHED PROPOSAL ONLY. No RTC, servo/pump disabled, all four echoes OFF on boot.
[env:diag_four_ultrasonic]
extends = m4_sensor_bringup
build_flags = ${m4_sensor_bringup.build_flags} -DM4_DIAGNOSTIC_MODE=7 -DM4_HX711_INSTALLED=1 -DM4_CURRENT_HARDWARE_PROFILE=1 -DM4_QUAD_ULTRASONIC=1

; Default diagnostic pump bench NEVER configures GPIO7 because F5305S active
; polarity/boot-off bias are NOT physically verified. Build/status-only target.
[env:diag_pump_bench]
extends = s3_real_no_psram
build_flags = ${s3_real_no_psram.build_flags} -DPUMP_BENCH_MODE=1 -DPUMP_BENCH_PHYSICAL_ENABLE=0 -DPUMP_BENCH_OFF_LEVEL=-1

; Report-only opt-in builds. Choose exactly ONE after physical F5305S input
; polarity AND boot/reset OFF bias are verified; never flash based on a guess.
[env:diag_pump_bench_active_high]
extends = s3_real_no_psram
build_flags = ${s3_real_no_psram.build_flags} -DPUMP_BENCH_MODE=1 -DPUMP_BENCH_PHYSICAL_ENABLE=1 -DPUMP_BENCH_OFF_LEVEL=0

[env:diag_pump_bench_active_low]
extends = s3_real_no_psram
build_flags = ${s3_real_no_psram.build_flags} -DPUMP_BENCH_MODE=1 -DPUMP_BENCH_PHYSICAL_ENABLE=1 -DPUMP_BENCH_OFF_LEVEL=1

; Preserve the six old pin-unassigned diagnostic build targets explicitly.
[env:diag_hx711_surrogate]
extends = m4_diagnostic
build_flags = ${m4_diagnostic.build_flags} -DM4_DIAGNOSTIC_MODE=1
[env:diag_rtc_surrogate]
extends = m4_diagnostic
build_flags = ${m4_diagnostic.build_flags} -DM4_DIAGNOSTIC_MODE=2
[env:diag_i2c_surrogate]
extends = m4_diagnostic
build_flags = ${m4_diagnostic.build_flags} -DM4_DIAGNOSTIC_MODE=3
[env:diag_food_sensor_surrogate]
extends = m4_diagnostic
build_flags = ${m4_diagnostic.build_flags} -DM4_DIAGNOSTIC_MODE=4
[env:diag_water_sensor_surrogate]
extends = m4_diagnostic
build_flags = ${m4_diagnostic.build_flags} -DM4_DIAGNOSTIC_MODE=5
[env:diag_oled_button_buzzer_surrogate]
extends = m4_diagnostic
build_flags = ${m4_diagnostic.build_flags} -DM4_DIAGNOSTIC_MODE=6

[env:esp32s3_16mb_no_psram_hw_safe_uart]
; Existing manually added environment retained, now shares its no-PSRAM settings.
extends = s3_real_no_psram
build_flags = ${s3_real_no_psram.build_flags} -DFORR_BUILD_BANNER=1

