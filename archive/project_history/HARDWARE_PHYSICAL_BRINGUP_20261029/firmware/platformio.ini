; Physical validation KIT only. Same pinned platform/framework/board as authority.
; No upload target is invoked by kit build tools. No PSRAM is enabled.
[platformio]
default_envs = diag_four_ultrasonic

[env]
platform = espressif32@55.3.311
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
extra_scripts = post:kit_metadata.py
build_flags =
    -DACTUATOR_OUTPUTS_ENABLED=0
    -DFORR_BOARD_S3=1
    -DFORR_REAL_S3_NO_PSRAM=1
    -DFORR_NATIVE_USB=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DFORR_HW_SAFE=1
    -DSERVO_DIAGNOSTIC_ENABLED=0
    -DPUMP_DIAGNOSTIC_ENABLED=0
    -DPHYSICAL_VALIDATION_KIT=1

[env:diag_four_ultrasonic]
build_src_filter = -<*> +<diagnostics.cpp>
build_flags = ${env.build_flags} -DM4_SENSOR_BRINGUP=1 -DM4_DIAGNOSTIC_MODE=7 -DM4_HX711_INSTALLED=1 -DM4_CURRENT_HARDWARE_PROFILE=1 -DM4_QUAD_ULTRASONIC=1

[env:diag_dog_buzzer]
build_src_filter = -<*> +<dog_buzzer_diagnostic.cpp>
build_flags = ${env.build_flags} -DDOG_BUZZER_DIAGNOSTIC=1

[env:diag_servo_bench]
build_src_filter = -<*> +<servo_bench.cpp>
build_flags = ${env.build_flags} -DSERVO_BENCH_MODE=1 -DSERVO_BENCH_PHYSICAL_ENABLE=1

[env:diag_pump_bench]
build_src_filter = -<*> +<pump_bench.cpp>
build_flags = ${env.build_flags} -DPUMP_BENCH_MODE=1 -DPUMP_BENCH_PHYSICAL_ENABLE=0 -DPUMP_BENCH_OFF_LEVEL=-1

; FUTURE ONLY, no image is built/shipped for these variants without owner evidence.
; Never pick polarity from the F5305S name or a software ACK.
[env:diag_pump_bench_active_high]
build_src_filter = -<*> +<pump_bench.cpp>
build_flags = ${env.build_flags} -DPUMP_BENCH_MODE=1 -DPUMP_BENCH_PHYSICAL_ENABLE=1 -DPUMP_BENCH_OFF_LEVEL=0

[env:diag_pump_bench_active_low]
build_src_filter = -<*> +<pump_bench.cpp>
build_flags = ${env.build_flags} -DPUMP_BENCH_MODE=1 -DPUMP_BENCH_PHYSICAL_ENABLE=1 -DPUMP_BENCH_OFF_LEVEL=1
